[package]
name = "hypercli-buzz-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "HyperCLI-maintained ACP harness that bridges Buzz events to hosted coding agents"

[package.metadata.hypercli]
upstream-buzz-ref = "8342dfcc5890b81a269a8ec3db73a8a56f76ce79"
upstream-buzz-tag = "desktop-v0.5.5"

[lib]
name = "hypercli_buzz_acp"
path = "src/lib.rs"

[[bin]]
name = "buzz-acp"
path = "src/main.rs"

[dependencies]
hypercli-sdk = { path = "../rs-sdk" }
buzz-core = { git = "https://github.com/block/buzz.git", rev = "8342dfcc5890b81a269a8ec3db73a8a56f76ce79" }
buzz-sdk = { git = "https://github.com/block/buzz.git", rev = "8342dfcc5890b81a269a8ec3db73a8a56f76ce79" }
buzz-persona = { git = "https://github.com/block/buzz.git", rev = "8342dfcc5890b81a269a8ec3db73a8a56f76ce79" }
nostr = { version = "0.44", features = ["nip44", "nip98"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
sha2 = "0.11"
base64 = "0.22"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "1.0"
evalexpr = "11"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
httparse = "1"
