# Standalone workspace: keeps Tauri's GUI dependency tree out of the root
# workspace so `cargo test --workspace` in the provider release stays lean.
[workspace]

[package]
name = "hypercli-desktop"
version = "0.1.0"
description = "HyperCLI desktop agent client"
edition = "2021"
license = "MIT"
repository = "https://github.com/HyperCLI/hypercli"

[lib]
name = "hypercli_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
dirs = "6"
secrecy = "0.10"
hypercli-sdk = { path = "../../rs-sdk" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
