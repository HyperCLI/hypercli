# Standalone workspace: keeps Tauri's GUI dependency tree out of the root
# workspace so `cargo test --workspace` in the provider release stays lean.
[workspace]

[package]
name = "hypercli-desktop"
version = "0.3.1"
description = "HyperCLI desktop agent client"
edition = "2021"
license = "MIT"
repository = "https://github.com/HyperCLI/hypercli"

[lib]
name = "hypercli_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
# Delivers hypercli://auth deep links into the running app (browser sign-in).
tauri-plugin-deep-link = "2"
# Re-launching the app focuses the existing window instead of spawning a
# second instance. Windows/Linux deliver deep links to a NEW instance's argv;
# the "deep-link" feature forwards them to the running instance.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Always compiled (their permissions must exist for capabilities/default.json),
# but only *registered* when build.rs emits `hypercli_updater_enabled` — i.e.
# when HYPERCLI_UPDATER_PUBLIC_KEY + HYPERCLI_UPDATER_ENDPOINT are set at
# build time. Dev builds carry no updater surface.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
# Required by `tauri::generate_context!()` expansion (tauri 2.11).
serde_json = "1"
dirs = "6"
secrecy = "0.10"
# Credential discovery/persistence only (~/.hypercli/config). All backend
# HTTP/WS traffic runs through ts-sdk in the webview; there is no Rust proxy.
hypercli-sdk = { path = "../../rs-sdk" }
