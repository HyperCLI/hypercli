# Standalone workspace: keeps Tauri's GUI dependency tree out of the root
# workspace so `cargo test --workspace` in the provider release stays lean.
[workspace]

[package]
name = "hypercli-desktop"
version = "0.1.2"
description = "HyperCLI desktop companion: configures credentials and installs the Buzz provider"
edition = "2021"
license = "MIT"
repository = "https://github.com/HyperCLI/hypercli"

[lib]
name = "hypercli_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# Windows/Linux deliver deep links to a NEW instance's argv; this forwards
# them to the running instance and focuses it (Buzz pattern).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Always compiled (their permissions must exist for capabilities/default.json),
# but only *registered* when build.rs emits `hypercli_updater_enabled` — i.e.
# when HYPERCLI_UPDATER_PUBLIC_KEY + HYPERCLI_UPDATER_ENDPOINT are set at
# build time. Dev builds carry no updater surface.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
gethostname = "0.5"
secrecy = "0.10"
uuid = "1"
hypercli-sdk = { path = "../../rs-sdk" }
