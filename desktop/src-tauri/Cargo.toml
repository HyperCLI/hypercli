# Standalone workspace: keeps Tauri's GUI dependency tree out of the root
# workspace so `cargo test --workspace` in the provider release stays lean.
[workspace]

[package]
name = "hypercli-desktop"
version = "0.1.3"
description = "HyperCLI desktop companion: configures credentials and installs the Buzz provider"
edition = "2021"
license = "MIT"
repository = "https://github.com/HyperCLI/hypercli"

[lib]
name = "hypercli_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# Windows/Linux deliver deep links to a NEW instance's argv; this forwards
# them to the running instance and focuses it (Buzz pattern).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Always compiled (their permissions must exist for capabilities/default.json),
# but only *registered* when build.rs emits `hypercli_updater_enabled` — i.e.
# when HYPERCLI_UPDATER_PUBLIC_KEY + HYPERCLI_UPDATER_ENDPOINT are set at
# build time. Dev builds carry no updater surface.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
atomic-write-file = "0.3"
dirs = "6"
gethostname = "0.5"
secrecy = "0.10"
uuid = { version = "1", features = ["v4"] }
nostr = "0.44"
nostr-sdk = "0.44"
hypercli-sdk = { path = "../../rs-sdk" }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "vendored"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "vendored"] }
