<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HyperCLI</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main class="card">
      <img src="logo.svg" alt="HyperCLI" class="logo logo-dark" />
      <img src="logo-light.svg" alt="HyperCLI" class="logo logo-light" />

      <!-- state: disconnected -->
      <section id="auth-disconnected" hidden>
        <h1>Connect your account</h1>
        <p class="hint">Sign in with your browser, or paste an API key from the dashboard.</p>
        <button id="login-btn" class="primary">Sign in with browser</button>
        <div class="divider"><span>or</span></div>
        <form id="key-form">
          <input id="key-input" type="password" placeholder="hyper-..." autocomplete="off" />
          <button type="submit">Save API key</button>
        </form>
      </section>

      <!-- state: connected -->
      <section id="auth-connected" hidden>
        <p class="hint"><span class="ok-mark">✓</span> Connected<span id="auth-detail"></span>
          <button id="logout-btn" class="link">Log out</button>
        </p>
        <div id="key-line" hidden>
          <span class="chip"><span class="chip-label">API key</span><span id="key-name"></span></span>
        </div>
        <p class="hint warn" id="auth-warning" hidden></p>
        <p class="hint" id="plan-line" hidden>
          No active plan — agents need one to launch.
          <button id="plans-btn" class="link">Purchase a plan</button>
        </p>
      </section>

      <!-- providers: only rendered when connected -->
      <section id="provider-section" hidden>
        <h1>Buzz provider</h1>
        <p class="hint" id="provider-hint"></p>
        <ul id="provider-list"></ul>
        <div class="button-row">
          <button id="install-btn" class="primary">Install providers</button>
          <button id="uninstall-btn" class="link" hidden>Uninstall</button>
        </div>
      </section>

      <!-- account fleet: only rendered when connected -->
      <section id="agents-section" hidden>
        <div class="section-heading">
          <div>
            <h1>Agents</h1>
            <p class="hint" id="agents-summary">Loading your agents…</p>
          </div>
          <button id="agents-refresh" class="icon-button" aria-label="Refresh agents" title="Refresh agents">↻</button>
        </div>
        <div class="segmented" role="group" aria-label="Agent filter">
          <button id="filter-buzz" data-filter="buzz" aria-pressed="true">Buzz</button>
          <button id="filter-all" data-filter="all" aria-pressed="false">All</button>
        </div>
        <div id="agent-list" class="agent-list" aria-live="polite"></div>
        <p id="agents-empty" class="hint" hidden>No Buzz agents yet. Create one in Buzz and it will appear here.</p>
      </section>

      <p id="status" role="status"></p>
      <div id="footer" class="button-row">
        <span class="hint" id="version-line"></span>
        <button id="update-btn" class="link" hidden>Update the HyperCLI app</button>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
