<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HyperCLI</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main class="card">
      <img src="logo.svg" alt="HyperCLI" class="logo" />

      <!-- state: disconnected -->
      <section id="auth-disconnected" hidden>
        <h1>Connect your account</h1>
        <p class="hint">Sign in with your browser, or paste an API key from the dashboard.</p>
        <button id="login-btn" class="primary">Sign in with browser</button>
        <div class="divider"><span>or</span></div>
        <form id="key-form">
          <input id="key-input" type="password" placeholder="hyper-..." autocomplete="off" />
          <button type="submit">Save API key</button>
        </form>
      </section>

      <!-- state: connected -->
      <section id="auth-connected" hidden>
        <p class="hint"><span class="ok-mark">✓</span> Connected — API key configured
          <button id="logout-btn" class="link">Log out</button>
        </p>
      </section>

      <!-- providers: only rendered when connected -->
      <section id="provider-section" hidden>
        <h1>Buzz provider</h1>
        <p class="hint" id="provider-hint"></p>
        <ul id="provider-list"></ul>
        <div class="button-row">
          <button id="install-btn" class="primary">Install providers</button>
          <button id="uninstall-btn" class="link" hidden>Uninstall</button>
        </div>
      </section>

      <p id="status" role="status"></p>
      <div id="footer" class="button-row">
        <button id="update-btn" class="link" hidden>Update the HyperCLI app</button>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
