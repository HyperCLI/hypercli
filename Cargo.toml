[workspace]
members = [
    "rs-sdk",
    "buzz-backend-provider",
]
# The Tauri app is deliberately its own workspace so provider release builds
# never compile GUI dependencies; it path-depends on rs-sdk across the boundary.
exclude = ["desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/HyperCLI/hypercli"

[workspace.dependencies]
dirs = "6"
nostr = "0.44"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
