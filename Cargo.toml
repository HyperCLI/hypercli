[workspace]
members = [
    "rs-sdk",
    "buzz-backend-provider",
    "hyper-acp/agent-client-protocol-schema",
    "hyper-acp/crates/hyper-acp",
    "hyper-acp/plugins/buzz",
    "hyper-acp/plugins/buzz-acp",
    "hyper-acp/plugins/slack-relay",
    "hyper-acp/schema/v1",
    "hyper-acp/schema/v2",
    "hyper-acp/schema-generator",
]
default-members = [
    "rs-sdk",
    "buzz-backend-provider",
    "hyper-acp/crates/hyper-acp",
    "hyper-acp/plugins/buzz",
    "hyper-acp/plugins/buzz-acp",
    "hyper-acp/plugins/slack-relay",
]
# The Tauri app is deliberately its own workspace so provider release builds
# never compile GUI dependencies; it path-depends on rs-sdk across the boundary.
exclude = ["desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/HyperCLI/hypercli"

[workspace.dependencies]
dirs = "6"
agent-client-protocol-schema = { path = "hyper-acp/agent-client-protocol-schema", version = "1.7.0" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
nostr = "0.44"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rustls = { version = "0.23", features = ["ring"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
let-underscore = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
cargo = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
pedantic = "warn"
