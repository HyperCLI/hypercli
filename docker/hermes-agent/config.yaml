_config_version: 33

model:
  provider: custom:hypercli
  default: default-anthropic

providers:
  hypercli:
    name: HyperCLI
    api: ${env:HYPER_API_BASE}
    key_env: HYPER_RUNTIME_API_KEY
    transport: anthropic_messages

memory:
  provider: mem0

cron:
  enabled: ${env:HERMES_CRON_ENABLED}

skills:
  external_dirs:
    - /opt/hypercli/skills
