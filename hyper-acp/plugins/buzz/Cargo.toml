[package]
name = "hyper-acp-buzz"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
repository = "https://github.com/HyperCLI/hypercli"
description = "Hyper ACP Buzz plugin adapter"
keywords = ["acp", "buzz", "agents"]
categories = ["development-tools"]

[lib]
name = "hyper_acp_buzz"
path = "src/lib.rs"

[dependencies]
buzz-core = { git = "https://github.com/block/buzz.git", rev = "eed74bde2f4797714335ac10c56c0b0244c1def4" }
buzz-sdk = { git = "https://github.com/block/buzz.git", rev = "eed74bde2f4797714335ac10c56c0b0244c1def4" }
buzz-persona = { git = "https://github.com/block/buzz.git", rev = "eed74bde2f4797714335ac10c56c0b0244c1def4" }

nostr = { version = "0.44", features = ["nip44", "nip98"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
sha2 = "0.11"
base64 = "0.22"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "1.0"
evalexpr = "11"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process", "test-util"] }
httparse = "1"
