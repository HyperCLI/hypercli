[package]
name = "hyper-acp-slack-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
description = "HyperCLI ACP Slack relay connector ported from OpenClaw Slack relay semantics"
repository = "https://github.com/HyperCLI/hypercli"
readme = "README.md"
keywords = ["acp", "slack", "relay", "hypercli"]
categories = ["development-tools"]

[lib]
name = "hyper_acp_slack_relay"
path = "src/lib.rs"

[dependencies]
agent-client-protocol = "2.0.0"
agent-client-protocol-schema = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
hmac = "0.12"
regex = "1.11"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = "2"
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = "1"

[lints]
workspace = true
