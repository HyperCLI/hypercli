name: CLI CI
run-name: CLI CI

# CLI gates for the public repo layout.
# The CLI sources are in this repo (ts-cli, ts-sdk, skills); the CI image is
# .github/docker/cli-ci/Dockerfile and the per-gate runner scripts
# live in .github/scripts/cli/ (bind-mounted at /tests, not baked in).
#
# One gate per command group (checks read `cli / agents`, `cli / jobs`, ...),
# plus a subcommand-matrix smoke per subcommand (checks read
# `cli / agents / chat`, ...). The matrix is generated from
# ts-cli/tests/ci-matrix.json by scripts/expand-ci-matrix.mjs;
# ts-cli/tests/ci-matrix.test.ts fails the run when the manifest drifts.
#
# `cli / publish` runs after every gate is green and builds the public
# hypercli-cli image (docker/hypercli-cli/Dockerfile: /opt/hypercli/bin/hyper +
# skills), verifies it locally, and publishes only that public image to GHCR as
# :<sha> and :latest. The live
# matrix needs HYPERCLI_CLI_CI_API_KEY (ci@ user, tag *:*); the narrower
# Desktop CI key lacks voice/files/activate.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cli-ci.yml'
      - '.github/scripts/cli/**'
      - '.github/docker/**'
      - 'ts-cli/**'
      - 'ts-sdk/**'
      - 'skills/**'
  workflow_dispatch:

# One CLI CI at a time, never cancelled mid-run: the live jobs mutate real dev
# state, so a superseded run must finish (and sweep its own hypercli-ci-* leftovers)
# before the next starts. e2e-routines additionally keeps its own non-cancelling
# group.
concurrency:
  group: cli-ci
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_ORG: hypercli
  CLI_CI_IMAGE_REPOSITORY: hypercli-cli-ci
  CLI_PUBLIC_IMAGE_REPOSITORY: hypercli-cli
  CLI_TESTS_DIR: .github/scripts/cli

jobs:
  # Builds the shared CI image locally. The self-hosted runners share the host
  # Docker daemon, so later jobs use the local tag without pulling/pushing.
  image:
    name: cli / image
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          set -euo pipefail
          TAG="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "image_tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "image=${CLI_CI_IMAGE_REPOSITORY}:${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build CI image
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.image }}"
          docker build \
            --pull \
            -f .github/docker/cli-ci/Dockerfile \
            -t "${IMAGE}" \
            .

  # Expands the smoke matrix from the manifest.
  expand:
    name: cli / expand
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      smokes: ${{ steps.matrices.outputs.smokes }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand ts-cli/tests/ci-matrix.json into the smoke matrix
        id: matrices
        working-directory: ts-cli
        run: node scripts/expand-ci-matrix.mjs

  # One gate per command group: the group's vitest files plus the bare
  # `node dist/index.js <group> --help` smoke, inside the shared image.
  gate:
    name: cli / ${{ matrix.group }}
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
          - group: me
          - group: configure
          - group: skills
          - group: agents
          - group: routines
          - group: jobs
          - group: flow
          - group: files
          - group: voice
          - group: websearch
    steps:
      - uses: actions/checkout@v4
      - name: Group vitest files
        run: docker run --rm -v "${GITHUB_WORKSPACE}/${CLI_TESTS_DIR}:/tests:ro" "${{ needs.image.outputs.image }}" /tests/gate.sh "${{ matrix.group }}"
      - name: Bare group --help smoke (offline, no API key)
        run: docker run --rm -v "${GITHUB_WORKSPACE}/${CLI_TESTS_DIR}:/tests:ro" "${{ needs.image.outputs.image }}" /tests/gate-smoke.sh "${{ matrix.group }}"

  # Smoke matrix: every non-bare smoke in the manifest, one check per
  # subcommand (grouped by command group in the run graph).
  smoke:
    name: cli / ${{ matrix.group }} / ${{ matrix.sub }}
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.smokes) }}
    steps:
      - uses: actions/checkout@v4
      - name: Offline --help smoke
        run: docker run --rm -v "${GITHUB_WORKSPACE}/${CLI_TESTS_DIR}:/tests:ro" "${{ needs.image.outputs.image }}" /tests/smoke.sh ${{ matrix.argv }}

  # npm pack --dry-run gate: tarball contents + LF shebang.
  pack:
    name: cli / pack
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pack gate (npm pack --dry-run assertions)
        run: docker run --rm -v "${GITHUB_WORKSPACE}/${CLI_TESTS_DIR}:/tests:ro" "${{ needs.image.outputs.image }}" /tests/test.sh tests/pack.test.ts

  # LF-only house rule gate.
  line-endings:
    name: cli / line-endings
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Line endings gate
        run: docker run --rm -v "${GITHUB_WORKSPACE}/${CLI_TESTS_DIR}:/tests:ro" "${{ needs.image.outputs.image }}" /tests/test.sh tests/line-endings.test.ts

  # tsc --noEmit for the CLI.
  typecheck:
    name: cli / typecheck
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck
        run: docker run --rm -v "${GITHUB_WORKSPACE}/${CLI_TESTS_DIR}:/tests:ro" "${{ needs.image.outputs.image }}" /tests/typecheck.sh

  # Summary gate: the full vitest suite (including tests/ci-matrix.test.ts).
  test:
    name: cli / test
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Full vitest suite
        run: docker run --rm -v "${GITHUB_WORKSPACE}/${CLI_TESTS_DIR}:/tests:ro" "${{ needs.image.outputs.image }}" /tests/test.sh

  # Live tests against the dev backend, one matrix job per subcommand. Each
  # job runs its steps sequentially inside a fresh container; persistent
  # agent names (hypercli-ci-<group>-<sub>) keep runs idempotent.
  live:
    name: cli / live / ${{ matrix.sub }}
    needs: [image, expand]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      HYPER_API_KEY: ${{ secrets.HYPERCLI_CLI_CI_API_KEY }}
      # --dev only retargets the agents API; jobs/flow/files/voice read
      # apiUrl from HYPER_API_BASE and would silently hit prod without it.
      # SDK reads AGENTS_WS_URL (not HYPER_AGENTS_WS_URL) for WS sessions.
      HYPER_API_BASE: https://api.dev.hypercli.com
      AGENTS_WS_URL: wss://api.agents.dev.hypercli.com/ws
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: me, sub: me }
          - { group: configure, sub: configure }
          - { group: skills, sub: list }
          - { group: skills, sub: ls }
          - { group: skills, sub: export }
          - { group: skills, sub: install }
          - { group: agents, sub: ls }
          - { group: agents, sub: list }
          - { group: agents, sub: status }
          - { group: agents, sub: wait }
          - { group: agents, sub: logs }
          - { group: agents, sub: exec }
          - { group: agents, sub: cp }
          - { group: agents, sub: token }
          - { group: agents, sub: models }
          - { group: agents, sub: create }
          - { group: agents, sub: activate }
          - { group: agents, sub: routines }
          # The only job that mutates for real: one serialized lifecycle,
          # unique name per run, sweeps its own leftovers.
          - { group: agents, sub: lifecycle }
          - { group: jobs, sub: gpus }
          - { group: jobs, sub: list }
          - { group: jobs, sub: ls }
          - { group: jobs, sub: get }
          - { group: jobs, sub: logs }
          - { group: jobs, sub: create }
          - { group: jobs, sub: cancel }
          - { group: jobs, sub: extend }
          - { group: jobs, sub: exec }
          - { group: flow, sub: list }
          - { group: flow, sub: status }
          - { group: flow, sub: wait }
          - { group: flow, sub: create }
          - { group: flow, sub: cancel }
          - { group: files, sub: upload }
          - { group: files, sub: get }
          - { group: files, sub: delete }
          - { group: voice, sub: tts }
          - { group: voice, sub: transcribe }
    steps:
      - uses: actions/checkout@v4
      - name: Live ${{ matrix.group }} ${{ matrix.sub }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/${CLI_TESTS_DIR}:/tests:ro" \
            -e HYPER_API_KEY -e HYPER_API_BASE -e AGENTS_WS_URL \
            -e LIFECYCLE_SUFFIX="$(echo "${{ github.sha }}" | cut -c1-7)-${{ github.run_attempt }}" \
            "${{ needs.image.outputs.image }}" \
            /tests/live.sh "${{ matrix.group }}" "${{ matrix.sub }}"

  # Live end-to-end: real agent + chat session json + one-shot routine that
  # lands a flag file on the agent. Serialized (no cancel-in-progress) since
  # it mutates real state; 8-minute in-run poll + create/wait dominate the
  # 30-minute budget.
  e2e-routines:
    name: cli / e2e-routines
    needs: [image, expand]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 30
    concurrency:
      group: cli-e2e-routines
      cancel-in-progress: false
    env:
      HYPER_API_KEY: ${{ secrets.HYPERCLI_CLI_CI_API_KEY }}
      HYPER_API_BASE: https://api.dev.hypercli.com
      AGENTS_WS_URL: wss://api.agents.dev.hypercli.com/ws
      # The dev gateway 404s /routines (scheduler fronted separately), so the
      # SDK needs the explicit routines base (ts-sdk routines.ts reads this).
      HYPER_ROUTINES_API_BASE: https://api.agents.dev.hypercli.com/routines
      # Debug knob: set the repo var to 1 to keep the container alive on
      # failure (live.sh tails forever; cancel the job to reap it).
      E2E_KEEP_ALIVE_ON_FAILURE: ${{ vars.CLI_E2E_KEEP_ALIVE_ON_FAILURE }}
    steps:
      - uses: actions/checkout@v4
      - name: Live agents e2e-routines
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/${CLI_TESTS_DIR}:/tests:ro" \
            -e HYPER_API_KEY -e HYPER_API_BASE -e AGENTS_WS_URL \
            -e HYPER_ROUTINES_API_BASE \
            -e E2E_KEEP_ALIVE_ON_FAILURE \
            -e LIFECYCLE_SUFFIX="$(echo "${{ github.sha }}" | cut -c1-7)-${{ github.run_attempt }}" \
            "${{ needs.image.outputs.image }}" \
            /tests/live.sh agents e2e-routines

  # Every gate green on main: build the public hypercli-cli image and publish
  # it to GHCR (hypercli-cli:<sha>, :latest). The smoke matrix may
  # legitimately expand to zero jobs, in which case it reports `skipped`.
  publish:
    name: cli / publish
    needs: [image, expand, gate, smoke, pack, line-endings, typecheck, test, live, e2e-routines]
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.image.result == 'success' &&
      needs.expand.result == 'success' &&
      needs.gate.result == 'success' &&
      (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') &&
      needs.pack.result == 'success' &&
      needs['line-endings'].result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.test.result == 'success' &&
      needs.live.result == 'success' &&
      needs['e2e-routines'].result == 'success'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build, verify, and publish the CLI image
        run: |
          set -euo pipefail
          SHA="${{ needs.image.outputs.image_tag }}"
          GHCR_IMAGE="${GHCR_REGISTRY}/${GHCR_ORG}/${CLI_PUBLIC_IMAGE_REPOSITORY}"
          IMAGE="${GHCR_IMAGE}"
          HYPERCLI_SHA="$(git rev-parse HEAD)"

          docker build \
            --pull \
            --label "org.opencontainers.image.source=https://github.com/HyperCLI/hypercli" \
            --label "org.opencontainers.image.revision=${HYPERCLI_SHA}" \
            --label "org.opencontainers.image.description=HyperCLI CLI bundle (/opt/hypercli/bin/hyper) and skills" \
            -t "${IMAGE}:${SHA}" \
            -f docker/hypercli-cli/Dockerfile \
            .

          CID="$(docker create "${IMAGE}:${SHA}" --help)"
          trap 'docker rm -f "${CID}" >/dev/null 2>&1 || true' EXIT
          OUT="$(mktemp -d)"
          docker cp -L "${CID}:/opt/hypercli/bin/hyper" "${OUT}/hyper"
          docker cp -L "${CID}:/opt/hypercli/package.json" "${OUT}/package.json"
          docker cp "${CID}:/opt/hypercli/skills" "${OUT}/skills"
          node "${OUT}/hyper" --help >/dev/null
          test -n "$(find "${OUT}/skills" -type f -name SKILL.md -print -quit)"
          CLI_VERSION="$(node -p "require('${OUT}/package.json').version")"
          rm -rf "${OUT}"

          docker tag "${GHCR_IMAGE}:${SHA}" "${GHCR_IMAGE}:latest"
          docker push "${GHCR_IMAGE}:${SHA}"
          docker push "${GHCR_IMAGE}:latest"

          {
            echo "### 🏷️ CLI image publish (cli ${CLI_VERSION}, hypercli@${HYPERCLI_SHA:0:7})"
            echo "- \`${GHCR_IMAGE}:${SHA}\` / \`:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
