name: SDK Integration Tests

on:
  workflow_call:

env:
  GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  BOOTSTRAP_REQUEST_TIMEOUT: "60"
  BOOTSTRAP_REQUEST_RETRIES: "10"
  BOOTSTRAP_REQUEST_BACKOFF_SECONDS: "5"
  SDK_INTEGRATION_RETRIES: "2"
  SDK_INTEGRATION_RETRY_DELAY_SECONDS: "20"

jobs:
  ts-sdk-unit:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Normalize workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"

      - name: Build SDK CI image
        run: docker build -f docker/sdk-ci.Dockerfile -t "sdk-ci:${{ github.sha }}" .

      - name: Run TS SDK unit tests
        run: docker run --rm "sdk-ci:${{ github.sha }}" /tests/ts-sdk.sh

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}"

  python-sdk-unit:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build SDK CI image
        run: docker build -f docker/sdk-ci.Dockerfile -t "sdk-ci:${{ github.sha }}" .

      - name: Run Python SDK and CLI unit tests
        run: docker run --rm "sdk-ci:${{ github.sha }}" /tests/py-unit.sh

  rust-sdk-unit:
    name: Rust SDK and Buzz provider
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Normalize workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Run Rust quality, protocol, docs, and package gates
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            rust:1.95.0-bookworm \
            bash -c '
              set -euo pipefail
              rustup component add rustfmt clippy
              cargo fmt --all --check
              cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
              cargo test --workspace --all-features --locked
              RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
              cargo package -p hypercli-sdk --locked --allow-dirty
            '

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

  hyper-acp-ws-unit:
    name: Hyper ACP WS Protocol Unit
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Normalize workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Run focused ACP protocol slice
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            rust:1.95.0-bookworm \
            cargo test --locked -p hyper-acp --test transport_passthrough

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

  hyper-acp-slack-unit:
    name: Hyper ACP Slack Unit
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Normalize workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Run focused ACP Slack slice
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            rust:1.95.0-bookworm \
            cargo test --locked -p hyper-acp-slack-relay

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

  buzz-acp-unit:
    name: Buzz ACP Unit
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Normalize workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Run focused Buzz ACP slice
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            rust:1.95.0-bookworm \
            cargo test --locked -p buzz-acp

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

  ts-sdk-integration:
    needs: [ts-sdk-unit, python-sdk-unit, rust-sdk-unit, hyper-acp-ws-unit, hyper-acp-slack-unit, buzz-acp-unit]
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      ADMIN_BACKEND_BASE: ${{ secrets.ADMIN_BACKEND_BASE }}
      TEST_API_BASE: https://api.dev.hypercli.com
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build SDK CI image
        run: docker build -f docker/sdk-ci.Dockerfile -t "sdk-ci:${{ github.sha }}" .

      - name: Run TS SDK integration tests
        run: |
          docker run --rm \
            -e BACKEND_API_KEY \
            -e ADMIN_BACKEND_BASE \
            -e TEST_API_BASE \
            -e SDK_INTEGRATION_RETRIES \
            -e SDK_INTEGRATION_RETRY_DELAY_SECONDS \
            -e BOOTSTRAP_REQUEST_TIMEOUT \
            -e BOOTSTRAP_REQUEST_RETRIES \
            -e BOOTSTRAP_REQUEST_BACKOFF_SECONDS \
            "sdk-ci:${{ github.sha }}" /tests/ts-integration.sh

  python-sdk-integration:
    needs: [ts-sdk-unit, python-sdk-unit, rust-sdk-unit, hyper-acp-ws-unit, hyper-acp-slack-unit, buzz-acp-unit]
    runs-on: self-hosted
    timeout-minutes: 35
    env:
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      ADMIN_BACKEND_BASE: ${{ secrets.ADMIN_BACKEND_BASE }}
      TEST_API_BASE: https://api.dev.hypercli.com
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build SDK CI image
        run: docker build -f docker/sdk-ci.Dockerfile -t "sdk-ci:${{ github.sha }}" .

      - name: Run Python SDK integration tests
        run: |
          docker run --rm \
            -e BACKEND_API_KEY \
            -e ADMIN_BACKEND_BASE \
            -e TEST_API_BASE \
            -e SDK_INTEGRATION_RETRIES \
            -e SDK_INTEGRATION_RETRY_DELAY_SECONDS \
            -e BOOTSTRAP_REQUEST_TIMEOUT \
            -e BOOTSTRAP_REQUEST_RETRIES \
            -e BOOTSTRAP_REQUEST_BACKOFF_SECONDS \
            "sdk-ci:${{ github.sha }}" /tests/py-integration.sh

  cli-integration:
    needs: [ts-sdk-unit, python-sdk-unit, rust-sdk-unit, hyper-acp-ws-unit, hyper-acp-slack-unit, buzz-acp-unit]
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      ADMIN_BACKEND_BASE: ${{ secrets.ADMIN_BACKEND_BASE }}
      TEST_API_BASE: https://api.dev.hypercli.com
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build SDK CI image
        run: docker build -f docker/sdk-ci.Dockerfile -t "sdk-ci:${{ github.sha }}" .

      - name: Run CLI dry-run integration tests
        run: |
          docker run --rm \
            -e BACKEND_API_KEY \
            -e ADMIN_BACKEND_BASE \
            -e TEST_API_BASE \
            -e SDK_INTEGRATION_RETRIES \
            -e SDK_INTEGRATION_RETRY_DELAY_SECONDS \
            -e BOOTSTRAP_REQUEST_TIMEOUT \
            -e BOOTSTRAP_REQUEST_RETRIES \
            -e BOOTSTRAP_REQUEST_BACKOFF_SECONDS \
            "sdk-ci:${{ github.sha }}" /tests/cli-integration.sh

  notify-sdk-integration:
    needs:
      - ts-sdk-unit
      - python-sdk-unit
      - rust-sdk-unit
      - hyper-acp-ws-unit
      - hyper-acp-slack-unit
      - buzz-acp-unit
      - ts-sdk-integration
      - python-sdk-integration
      - cli-integration
    if: always()
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Normalize workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Notify SDK integration result
        continue-on-error: true
        env:
          NOTIFY_URL: ${{ vars.NOTIFY_URL }}
          NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY }}
        run: |
          if [ "${{ needs.ts-sdk-unit.result }}" = "success" ] && [ "${{ needs.python-sdk-unit.result }}" = "success" ] && [ "${{ needs.rust-sdk-unit.result }}" = "success" ] && [ "${{ needs['hyper-acp-ws-unit'].result }}" = "success" ] && [ "${{ needs['hyper-acp-slack-unit'].result }}" = "success" ] && [ "${{ needs['buzz-acp-unit'].result }}" = "success" ] && [ "${{ needs.ts-sdk-integration.result }}" = "success" ] && [ "${{ needs.python-sdk-integration.result }}" = "success" ] && [ "${{ needs.cli-integration.result }}" = "success" ]; then
            STATUS="success"
            MESSAGE="SDK, CLI unit, and integration tests passed"
          else
            STATUS="failure"
            MESSAGE="SDK or CLI integration tests failed"
          fi

          python3 .github/scripts/ci_notify.py \
            --category sdk \
            --phase test \
            --status "${STATUS}" \
            --event "${{ github.event_name }}" \
            --message "${MESSAGE}" \
            --workflow "SDK Integration Tests" \
            --channel github \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail workflow when SDK jobs fail
        if: needs.ts-sdk-unit.result != 'success' || needs.python-sdk-unit.result != 'success' || needs.rust-sdk-unit.result != 'success' || needs['hyper-acp-ws-unit'].result != 'success' || needs['hyper-acp-slack-unit'].result != 'success' || needs['buzz-acp-unit'].result != 'success' || needs.ts-sdk-integration.result != 'success' || needs.python-sdk-integration.result != 'success' || needs.cli-integration.result != 'success'
        run: exit 1
