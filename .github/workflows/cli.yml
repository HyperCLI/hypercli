name: CLI CI
run-name: CLI CI

# One gate per command group (checks read `cli / agents`, `cli / jobs`, ...),
# plus a subcommand-matrix smoke per subcommand (checks read
# `cli / agents / chat`, ...). The matrix is generated from
# cli/tests/ci-matrix.json by cli/scripts/expand-ci-matrix.mjs — adding a
# subcommand means adding a usage line (public) or a HIDDEN entry plus one
# manifest line; cli/tests/ci-matrix.test.ts fails the run when the manifest
# drifts from the registry.
#
# No npm cache uploads. Jobs run inside a pre-built image
# (docker/cli-ci.Dockerfile) with ts-sdk + cli deps baked in; the
# image is built/pushed once per lockfile change by the `image` job and
# re-tagged from the registry digest otherwise. Registry coordinates come
# from CI env/secrets, not this file.
#
# All jobs run on the self-hosted Linux runners. Windows is not gated.
#
# Coordination uses a GitHub concurrency group (no runner-local lock files or
# flock, per AGENTS.md).

on:
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/cli.yml"
      - "docker/cli-ci.Dockerfile"
      - ".github/scripts/cli_container_entrypoint.sh"
      - "cli/**"
      - "skills/**"
      - "ts-sdk/**"
  pull_request:
    paths:
      - ".github/workflows/cli.yml"
      - "docker/cli-ci.Dockerfile"
      - ".github/scripts/cli_container_entrypoint.sh"
      - "cli/**"
      - "skills/**"
      - "ts-sdk/**"
  workflow_dispatch:

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  REGISTRY: ${{ secrets.CI_REGISTRY }}
  REGISTRY_ORG: ${{ secrets.CI_REGISTRY_ORG }}
  CLI_CI_IMAGE_REPOSITORY: hypercli-cli-ci

jobs:
  # Builds (or reuses) the shared CI image. Tag is keyed off the lockfiles +
  # Dockerfile so dependency changes force a rebuild and everything else
  # reuses the pushed image.
  image:
    name: cli / image
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          set -euo pipefail
          TAG="$(sha256sum \
            ts-sdk/package-lock.json \
            cli/package-lock.json \
            docker/cli-ci.Dockerfile \
            .github/scripts/cli_container_entrypoint.sh \
            | sha256sum | cut -c1-16)"
          echo "image_tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}

      - name: Build and push image if absent
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REGISTRY_ORG}/${CLI_CI_IMAGE_REPOSITORY}:${{ steps.meta.outputs.image_tag }}"
          if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "image already present: ${IMAGE}"
            exit 0
          fi
          docker build \
            -f docker/cli-ci.Dockerfile \
            -t "${IMAGE}" \
            .
          docker push "${IMAGE}"

  # One gate per command group: the group's vitest files plus the bare
  # `node dist/index.js <group> --help` smoke, inside the shared image.
  gate:
    name: cli / ${{ matrix.group }}
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
          - group: me
          - group: configure
          - group: skills
          - group: agents
          - group: jobs
          - group: flow
          - group: files
          - group: voice
    container:
      image: ${{ needs.expand.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the group's vitest files (from ci-matrix.json)
        run: |
          set -euo pipefail
          /usr/local/bin/cli_container_entrypoint true
          cd /workspace/cli
          tests="$(node -p "require('./tests/ci-matrix.json').groups['${{ matrix.group }}'].tests.map((t) => 'tests/' + t + '.test.ts').join(' ')")"
          if [ -n "${tests}" ]; then
            npx vitest run ${tests}
          else
            echo "no vitest files declared for group '${{ matrix.group }}' in tests/ci-matrix.json"
          fi

      - name: Bare group --help smoke (offline, no API key)
        run: |
          set -euo pipefail
          cd /workspace/cli
          if [ "${{ matrix.group }}" = "core" ]; then
            node dist/index.js > /dev/null
            node dist/index.js --help > /dev/null
          else
            node dist/index.js ${{ matrix.group }} --help > /dev/null
          fi

  # Subcommand matrix: every non-bare smoke in the manifest, one check per
  # subcommand, inside the shared image.
  smoke:
    name: cli / ${{ matrix.name }}
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.smokes) }}
    container:
      image: ${{ needs.expand.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Offline --help smoke
        run: |
          set -euo pipefail
          /usr/local/bin/cli_container_entrypoint true
          cd /workspace/cli
          node dist/index.js ${{ matrix.argv }} > /dev/null
          echo "exit 0: hyper ${{ matrix.argv }}"

  # Expands the smoke matrix and the containered job's image ref (kept tiny and
  # separate; runs on the runner, not in the image, so it can emit job-level
  # expressions). Everything here must exist before any `${{ needs.expand }}`
  # reference resolves.
  expand:
    name: cli / expand
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      smokes: ${{ steps.matrices.outputs.smokes }}
      image: ${{ needs.expand.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand cli/tests/ci-matrix.json into the smoke matrix
        id: matrices
        working-directory: cli
        run: node scripts/expand-ci-matrix.mjs
      - name: Resolve CLI CI image ref
        id: image_ref
        run: |
          set -euo pipefail
          printf 'image=%s/%s/%s:%s\n' \
            "${REGISTRY}" "${REGISTRY_ORG}" "${CLI_CI_IMAGE_REPOSITORY}" \
            "$(sha256sum \
              ts-sdk/package-lock.json \
              cli/package-lock.json \
              docker/cli-ci.Dockerfile \
              .github/scripts/cli_container_entrypoint.sh \
              | sha256sum | cut -c1-16)" \
            >> "${GITHUB_OUTPUT}"

  # npm pack --dry-run gate: tarball contents + LF shebang.
  pack:
    name: cli / pack
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 20
    container:
      image: ${{ needs.expand.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Pack gate (npm pack --dry-run assertions)
        run: |
          set -euo pipefail
          /usr/local/bin/cli_container_entrypoint true
          cd /workspace/cli
          npx vitest run tests/pack.test.ts

  # LF-only house rule gate.
  line-endings:
    name: cli / line-endings
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 10
    container:
      image: ${{ needs.expand.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Line endings gate
        run: |
          set -euo pipefail
          /usr/local/bin/cli_container_entrypoint true
          cd /workspace/cli
          npx vitest run tests/line-endings.test.ts

  # tsc --noEmit for the CLI.
  typecheck:
    name: cli / typecheck
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 15
    container:
      image: ${{ needs.expand.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck
        run: |
          set -euo pipefail
          /usr/local/bin/cli_container_entrypoint true
          cd /workspace/cli
          npm run typecheck

  # Summary gate: the full vitest suite (including tests/ci-matrix.test.ts),
  # gated on every other check above.
  test:
    name: cli / test
    needs: [gate, smoke, pack, line-endings, typecheck, expand]
    runs-on: self-hosted
    timeout-minutes: 25
    container:
      image: ${{ needs.expand.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Full vitest suite
        run: |
          set -euo pipefail
          /usr/local/bin/cli_container_entrypoint true
          cd /workspace/cli
          npx vitest run
