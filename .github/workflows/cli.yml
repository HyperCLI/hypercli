name: CLI CI
run-name: CLI CI

# One gate per command group (checks read `cli / agents`, `cli / jobs`, ...),
# plus a subcommand-matrix smoke per subcommand (checks read
# `cli / agents / chat`, ...). The matrix is generated from
# cli/tests/ci-matrix.json by cli/scripts/expand-ci-matrix.mjs — adding a
# subcommand means adding a usage line (public) or a HIDDEN entry plus one
# manifest line; cli/tests/ci-matrix.test.ts fails the run when the manifest
# drifts from the registry.
#
# No npm cache uploads. The image job builds/pushes docker/cli-ci.Dockerfile
# (ts-sdk + cli deps baked in) tagged with the short commit SHA; every test
# job runs one `docker run` against the mounted checkout, deferring to
# .github/scripts/cli_container_entrypoint.sh. Registry coordinates come from
# CI secrets, not this file.
#
# All jobs run on the self-hosted Linux runners. Windows is not gated.
#
# Coordination uses a GitHub concurrency group (no runner-local lock files or
# flock, per AGENTS.md).

on:
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/cli.yml"
      - "docker/cli-ci.Dockerfile"
      - ".github/scripts/cli_container_entrypoint.sh"
      - "cli/**"
      - "skills/**"
      - "ts-sdk/**"
  pull_request:
    paths:
      - ".github/workflows/cli.yml"
      - "docker/cli-ci.Dockerfile"
      - ".github/scripts/cli_container_entrypoint.sh"
      - "cli/**"
      - "skills/**"
      - "ts-sdk/**"
  workflow_dispatch:

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  REGISTRY: ${{ secrets.CI_REGISTRY }}
  REGISTRY_ORG: ${{ secrets.CI_REGISTRY_ORG }}
  CLI_CI_IMAGE_REPOSITORY: hypercli-cli-ci

jobs:
  # Builds (or reuses) the shared CI image. Tagged with the short commit SHA
  # (same as hyperclaw-backend); the image is rebuilt when it is absent from
  # the registry for this SHA.
  image:
    name: cli / image
    runs-on: self-hosted
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          set -euo pipefail
          TAG="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "image_tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}

      - name: Build and push image if absent
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REGISTRY_ORG}/${CLI_CI_IMAGE_REPOSITORY}:${{ steps.meta.outputs.image_tag }}"
          if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "image already present: ${IMAGE}"
            exit 0
          fi
          docker build \
            -f docker/cli-ci.Dockerfile \
            -t "${IMAGE}" \
            .
          docker push "${IMAGE}"

  # Expands the smoke matrix and the image ref. Runs on the runner so every
  # test job can reference `needs.expand.outputs.*` without re-deriving them.
  expand:
    name: cli / expand
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      smokes: ${{ steps.matrices.outputs.smokes }}
      image: ${{ steps.image_ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand cli/tests/ci-matrix.json into the smoke matrix
        id: matrices
        working-directory: cli
        run: node scripts/expand-ci-matrix.mjs
      - name: Resolve CLI CI image ref
        id: image_ref
        run: |
          set -euo pipefail
          TAG="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "image=${REGISTRY}/${REGISTRY_ORG}/${CLI_CI_IMAGE_REPOSITORY}:${TAG}" >> "${GITHUB_OUTPUT}"

  # One gate per command group: the group's vitest files plus the bare
  # `node dist/index.js <group> --help` smoke, inside the shared image.
  gate:
    name: cli / ${{ matrix.group }}
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
          - group: me
          - group: configure
          - group: skills
          - group: agents
          - group: jobs
          - group: flow
          - group: files
          - group: voice
    steps:
      - uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}

      - name: Run the group's vitest files (from ci-matrix.json)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${{ needs.expand.outputs.image }}" \
            gate "${{ matrix.group }}"

      - name: Bare group --help smoke (offline, no API key)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${{ needs.expand.outputs.image }}" \
            gate-smoke "${{ matrix.group }}"

  # Subcommand matrix: every non-bare smoke in the manifest, one check per
  # subcommand, inside the shared image.
  smoke:
    name: cli / ${{ matrix.name }}
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.smokes) }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}

      - name: Offline --help smoke
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${{ needs.expand.outputs.image }}" \
            smoke "${{ matrix.argv }}"

  # npm pack --dry-run gate: tarball contents + LF shebang.
  pack:
    name: cli / pack
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}

      - name: Pack gate (npm pack --dry-run assertions)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${{ needs.expand.outputs.image }}" \
            test tests/pack.test.ts

  # LF-only house rule gate.
  line-endings:
    name: cli / line-endings
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}

      - name: Line endings gate
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${{ needs.expand.outputs.image }}" \
            test tests/line-endings.test.ts

  # tsc --noEmit for the CLI.
  typecheck:
    name: cli / typecheck
    needs: [image, expand]
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}

      - name: Typecheck
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${{ needs.expand.outputs.image }}" \
            typecheck

  # Summary gate: the full vitest suite (including tests/ci-matrix.test.ts),
  # gated on every other check above.
  test:
    name: cli / test
    needs: [gate, smoke, pack, line-endings, typecheck]
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_TOKEN }}

      - name: Full vitest suite
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${{ needs.expand.outputs.image }}" \
            test
