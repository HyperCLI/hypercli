name: playwright-privy-live

on:
  workflow_call:
    inputs:
      test_base_url:
        required: true
        type: string
      test_api_base_url:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      test_base_url:
        required: true
        type: string
      test_api_base_url:
        required: true
        type: string

env:
  GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  playwright-privy-live:
    runs-on: self-hosted
    timeout-minutes: 30
    concurrency:
      group: hypercli-frontend-e2e-privy
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      TEST_BASE_URL: ${{ inputs.test_base_url }}
      TEST_API_BASE_URL: ${{ inputs.test_api_base_url }}
      TEST_EMAIL: ${{ vars.TEST_EMAIL }}
      TEST_IMAP_HOST: ${{ vars.TEST_IMAP_HOST }}
      TEST_IMAP_USER: ${{ secrets.TEST_IMAP_USER }}
      TEST_IMAP_PASS: ${{ secrets.TEST_IMAP_PASS }}
      NOTIFY_URL: ${{ vars.NOTIFY_URL }}
      PLAYWRIGHT_ARTIFACTS_DIR: ${{ github.workspace }}/.e2e-artifacts/playwright-privy-live-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Normalize workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Build E2E image
        id: build-e2e
        run: |
          IMAGE_TAG="e2e-privy-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            .github/scripts/build_e2e_image.sh >> "$GITHUB_OUTPUT"

      - name: Run post-deploy login smoke
        id: e2e
        continue-on-error: true
        env:
          NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY }}
        run: |
          ARTIFACTS_DIR="${PLAYWRIGHT_ARTIFACTS_DIR}"
          rm -rf "${ARTIFACTS_DIR}"
          mkdir -p "${ARTIFACTS_DIR}"
          docker run --rm --init \
            -e CI=true \
            -e TEST_BASE_URL \
            -e TEST_API_BASE_URL \
            -e TEST_EMAIL \
            -e TEST_IMAP_HOST \
            -e TEST_IMAP_USER \
            -e TEST_IMAP_PASS \
            -e NOTIFY_URL \
            -e NOTIFY_API_KEY \
            -e GITHUB_RUN_URL \
            -e E2E_ARTIFACTS_DIR=/artifacts \
            -v "${ARTIFACTS_DIR}:/artifacts" \
            "${{ steps.build-e2e.outputs.e2e_image }}" \
            bash -lc 'cd /workspace && ./.github/scripts/run_e2e_privy_live.sh'

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-privy-live-artifacts
          path: ${{ env.PLAYWRIGHT_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Notify e2e result
        if: steps.e2e.outcome == 'success'
        continue-on-error: true
        env:
          NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY }}
          E2E_STATUS: ${{ steps.e2e.outcome }}
        run: |
          MESSAGE="Post-deploy Privy login smoke passed (${{ inputs.test_base_url }})"
          python3 .github/scripts/ci_notify.py \
            --category frontend \
            --phase test \
            --status "${E2E_STATUS}" \
            --event "${{ github.event_name }}" \
            --message "${MESSAGE}" \
            --workflow "playwright-privy-live" \
            --channel frontend \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail workflow on e2e failure
        if: steps.e2e.outcome == 'failure'
        run: exit 1
