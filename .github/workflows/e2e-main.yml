name: playwright-main

on:
  workflow_call:
  workflow_dispatch:

env:
  GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  playwright-main:
    runs-on: self-hosted
    timeout-minutes: 45
    concurrency:
      group: hypercli-frontend-e2e-main
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      TEST_HOSTNAME: 127.0.0.1
      PLAYWRIGHT_ARTIFACTS_DIR: ${{ github.workspace }}/.e2e-artifacts/playwright-main-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Normalize workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Build E2E image
        id: build-e2e
        run: |
          IMAGE_TAG="e2e-main-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            .github/scripts/build_e2e_image.sh >> "$GITHUB_OUTPUT"

      - name: Run dockerized Playwright tests
        id: e2e
        continue-on-error: true
        run: |
          ARTIFACTS_DIR="${PLAYWRIGHT_ARTIFACTS_DIR}"
          rm -rf "${ARTIFACTS_DIR}"
          mkdir -p "${ARTIFACTS_DIR}"
          docker run --rm --init \
            -e CI=true \
            -e TEST_HOSTNAME \
            -e E2E_ARTIFACTS_DIR=/artifacts \
            -v "${ARTIFACTS_DIR}:/artifacts" \
            "${{ steps.build-e2e.outputs.e2e_image }}" \
            bash -lc 'cd /workspace && ./.github/scripts/run_e2e_main.sh'

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-main-artifacts
          path: ${{ env.PLAYWRIGHT_ARTIFACTS_DIR }}
          if-no-files-found: ignore

      - name: Fail workflow on e2e failure
        if: steps.e2e.outcome == 'failure'
        run: exit 1
