name: Frontend CI
run-name: Frontend CI

on:
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "docker/**"
      - "site/**"
      - "ts-sdk/**"
      - "sdk/**"
      - "cli/**"
      - "rs-sdk/**"
      - "hyper-acp/**"
      - "buzz-backend-provider/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  sdk:
    uses: ./.github/workflows/sdk-integration-tests.yml
    secrets: inherit

  # Builds (or reuses) the shared site builder image. Tag is keyed off the
  # builder inputs (Dockerfile + entrypoint + lockfiles) so dependency changes
  # force a rebuild and everything else reuses the pushed image. Registry
  # coordinates come from CI secrets, not this file.
  build-site-builder:
    runs-on: self-hosted
    concurrency:
      group: hypercli-site-builder
      cancel-in-progress: false
    outputs:
      site_builder_image: ${{ steps.meta.outputs.site_builder_image }}
    env:
      SITE_BUILDER_REGISTRY: ${{ secrets.SITE_BUILDER_REGISTRY }}
      SITE_BUILDER_REGISTRY_USERNAME: ${{ secrets.SITE_BUILDER_REGISTRY_USERNAME }}
      SITE_BUILDER_REGISTRY_PASSWORD: ${{ secrets.SITE_BUILDER_REGISTRY_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Normalize workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Prepare isolated Docker config
        run: |
          set -euo pipefail
          docker_config_dir="${RUNNER_TEMP}/docker-config-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          echo "DOCKER_CONFIG=${docker_config_dir}" >> "${GITHUB_ENV}"
          mkdir -p "${docker_config_dir}"

      - name: Require site builder registry config
        run: |
          set -euo pipefail
          if [ -z "${SITE_BUILDER_REGISTRY:-}" ] \
            || [ -z "${SITE_BUILDER_REGISTRY_USERNAME:-}" ] \
            || [ -z "${SITE_BUILDER_REGISTRY_PASSWORD:-}" ]; then
            echo "::error::SITE_BUILDER_REGISTRY, SITE_BUILDER_REGISTRY_USERNAME, and SITE_BUILDER_REGISTRY_PASSWORD are required for site publishing."
            exit 1
          fi

      - name: Compute site builder image ref
        id: meta
        run: |
          set -euo pipefail
          TAG="$(sha256sum \
            docker/build-site.Dockerfile \
            .github/scripts/site_container_entrypoint.sh \
            .github/scripts/build_site_image.sh \
            ts-sdk/package-lock.json \
            site/package-lock.json \
            | sha256sum | cut -c1-16)"
          echo "site_builder_image=${SITE_BUILDER_REGISTRY}/hypercli/hypercli-site-builder:${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Log in to site builder registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SITE_BUILDER_REGISTRY }}
          username: ${{ env.SITE_BUILDER_REGISTRY_USERNAME }}
          password: ${{ env.SITE_BUILDER_REGISTRY_PASSWORD }}

      - name: Build and push site builder image if absent
        run: |
          set -euo pipefail
          SITE_IMAGE="${{ steps.meta.outputs.site_builder_image }}"
          if docker manifest inspect "${SITE_IMAGE}" >/dev/null 2>&1; then
            echo "image already present: ${SITE_IMAGE}"
            exit 0
          fi
          docker builder prune --all --force --filter "until=24h"
          IMAGE_TAG="${SITE_IMAGE##*:}" \
          SITE_IMAGE="${SITE_IMAGE}" \
          PUSH_IMAGE=1 \
            .github/scripts/build_site_image.sh

  publish-main:
    needs: build-site-builder
    uses: ./.github/workflows/publish-sites.yml
    with:
      deploy_environment: ${{ github.ref_name == 'main' && 'feat' || 'dev' }}
      site: main
    secrets: inherit

  publish-console:
    needs: build-site-builder
    uses: ./.github/workflows/publish-sites.yml
    with:
      deploy_environment: ${{ github.ref_name == 'main' && 'feat' || 'dev' }}
      site: console
    secrets: inherit

  publish-claw:
    needs: build-site-builder
    uses: ./.github/workflows/publish-sites.yml
    with:
      deploy_environment: ${{ github.ref_name == 'main' && 'feat' || 'dev' }}
      site: claw
    secrets: inherit

  e2e-console:
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit

  e2e-agents:
    # Only login.spec.ts consumes the shared Privy OTP inbox; every other spec
    # authenticates via the backend admin bootstrap, so the suites run in parallel.
    uses: ./.github/workflows/e2e-agents.yml
    secrets: inherit

  privy-final:
    # The repo's only Privy OTP gate: email-OTP login against the site just
    # published from this branch (feat from main, dev from dev). Exactly one
    # Privy gate per repo — the shared OTP inbox collides under parallel
    # login runs.
    needs: publish-claw
    uses: ./.github/workflows/privy-final.yml
    with:
      test_base_url: ${{ github.ref_name == 'main' && 'https://agents.feat.hypercli.com' || 'https://agents.dev.hypercli.com' }}
      test_api_base_url: ${{ github.ref_name == 'main' && 'https://api.hypercli.com' || 'https://api.dev.hypercli.com' }}
    secrets: inherit

  e2e-main:
    uses: ./.github/workflows/e2e-main.yml
    secrets: inherit
