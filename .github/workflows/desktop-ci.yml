name: Desktop CI

# The desktop crate lives outside the root cargo workspace (deliberately —
# provider release builds must never compile GUI deps), so the workspace-wide
# gates in other workflows do not cover it. This closes that blind spot.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "rs-sdk/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "rs-sdk/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  rust:
    name: Desktop crate (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Install Tauri Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgtk-3-dev librsvg2-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: fmt, clippy, test
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  ui:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build SDK from sibling checkout
        shell: bash
        working-directory: ts-sdk
        # desktop depends on @hypercli.com/sdk via file:../ts-sdk; the SDK's
        # types import its own deps (e.g. @agentclientprotocol/sdk), so the
        # SDK must be installed and built before desktop can typecheck.
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          npm run build

      - name: Install, typecheck, build
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          npm run typecheck
          npm run build
