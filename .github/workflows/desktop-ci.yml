name: Desktop CI

# The desktop crate lives outside the root cargo workspace (deliberately —
# provider release builds must never compile GUI deps), so the workspace-wide
# gates in other workflows do not cover it. This closes that blind spot.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "rs-sdk/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "rs-sdk/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  rust:
    name: Desktop crate (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Install Tauri Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgtk-3-dev librsvg2-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: fmt, clippy, test
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

  ui:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build SDK from sibling checkout
        shell: bash
        working-directory: ts-sdk
        # desktop depends on @hypercli.com/sdk via file:../ts-sdk; the SDK's
        # types import its own deps (e.g. @agentclientprotocol/sdk), so the
        # SDK must be installed and built before desktop can typecheck.
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          npm run build

      - name: Install, typecheck, build
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          npm run typecheck
          npm run build

  e2e:
    name: Desktop e2e (create agent, chat)
    # Real mutation against the dev backend, so this runs on the self-hosted
    # runners like the other live suites. Serialized per-branch: the CI
    # account's slot inventory is finite and the spec creates a real agent.
    runs-on: self-hosted
    timeout-minutes: 20
    concurrency:
      group: desktop-e2e-${{ github.ref }}
      cancel-in-progress: false
    env:
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HYPER_API_KEY: ${{ secrets.HYPERCLI_DEV_API_KEY }}
      # The injected dev credential only feeds the vite serve mode; the suite
      # creates real agents, so it must stay on the dev backend.
      HYPER_API_BASE: https://api.dev.hypercli.com
    steps:
      - uses: actions/checkout@v4

      - name: Normalize workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build SDK from sibling checkout
        shell: bash
        working-directory: ts-sdk
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          npm run build

      - name: Install desktop + Playwright browser
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          npx playwright install chromium

      - name: Run desktop e2e
        id: e2e
        continue-on-error: true
        shell: bash
        working-directory: desktop
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/desktop-e2e.log

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            desktop/test-results/**
            desktop/playwright-report/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify failure with video
        if: failure() && steps.e2e.outcome == 'failure'
        continue-on-error: true
        env:
          NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY }}
        run: python3 .github/scripts/notify_desktop_e2e_failure.py

      - name: Fail workflow on e2e failure
        if: steps.e2e.outcome == 'failure'
        run: exit 1
