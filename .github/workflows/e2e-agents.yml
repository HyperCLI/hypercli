name: playwright-agents

on:
  workflow_call:
  workflow_dispatch:

env:
  GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  playwright-agents:
    runs-on: self-hosted
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: openclaw
            spec: >-
              tests/claw/agents-e2e.spec.ts
              tests/claw/agent-chat-stop.spec.ts
          - lane: hermes
            spec: tests/claw/agents-hermes-e2e.spec.ts
    name: e2e-${{ matrix.lane }}
    concurrency:
      group: hypercli-frontend-e2e-agents
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      TEST_HOSTNAME: 127.0.0.1
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      TEST_API_BASE_URL: https://api.dev.hypercli.com
      TEST_AGENTS_API_BASE_URL: https://api.dev.hypercli.com/agents
      TEST_STRIPE_AGENTS_SECRET_KEY: ${{ secrets.TEST_STRIPE_AGENTS_SECRET_KEY }}
      NOTIFY_URL: ${{ vars.NOTIFY_URL }}
      E2E_SPECS: ${{ matrix.spec }}
      PLAYWRIGHT_ARTIFACTS_DIR: ${{ github.workspace }}/.e2e-artifacts/playwright-agents-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Normalize workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Bootstrap isolated agents test user
        run: |
          python3 .github/scripts/bootstrap_agents_e2e_user.py bootstrap \
            --suite agents-${{ matrix.lane }}-e2e \
            --state-file "${RUNNER_TEMP}/hypercli-agents-${{ matrix.lane }}-e2e-user-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" \
            --github-env-file "$GITHUB_ENV"

      - name: Build E2E image
        id: build-e2e
        run: |
          rm -rf -- "${GITHUB_WORKSPACE}/.e2e-artifacts/playwright-agents-${{ matrix.lane }}-"*
          E2E_IMAGE_FAMILY="e2e-agents" \
          PRUNE_BUILD_CACHE=1 \
          IMAGE_TAG="e2e-agents-${{ matrix.lane }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            .github/scripts/build_e2e_image.sh >> "$GITHUB_OUTPUT"

      - name: Run dockerized Playwright tests
        id: e2e
        continue-on-error: true
        env:
          NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY }}
        run: |
          ARTIFACTS_DIR="${PLAYWRIGHT_ARTIFACTS_DIR}"
          rm -rf "${ARTIFACTS_DIR}"
          mkdir -p "${ARTIFACTS_DIR}"
          # Mint the identity's session JWT here, moments before the container
          # starts, so the spec itself needs no admin credentials or calls.
          TEST_USER_TOKEN="$(python3 .github/scripts/bootstrap_agents_e2e_user.py login \
            --state-file "${AGENTS_E2E_USER_STATE_FILE}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["TEST_USER_TOKEN"])')"
          export TEST_USER_TOKEN
          docker run --rm --init --dns-search=. \
            -e CI=true \
            -e TEST_HOSTNAME \
            -e BACKEND_API_KEY \
            -e TEST_API_BASE_URL \
            -e TEST_EMAIL \
            -e TEST_USER_TOKEN \
            -e TEST_AGENTS_API_BASE_URL \
            -e TEST_STRIPE_AGENTS_SECRET_KEY \
            -e NOTIFY_URL \
            -e E2E_SPECS \
            -e NOTIFY_API_KEY \
            -e GITHUB_RUN_URL \
            -e E2E_ARTIFACTS_DIR=/artifacts \
            -v "${ARTIFACTS_DIR}:/artifacts" \
            "${{ steps.build-e2e.outputs.e2e_image }}" \
            bash -lc 'cd /workspace && ./.github/scripts/run_e2e_agents.sh'

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.lane }}-artifacts
          path: ${{ env.PLAYWRIGHT_ARTIFACTS_DIR }}
          if-no-files-found: ignore
          retention-days: 3

      - name: Cleanup local E2E resources
        if: always()
        continue-on-error: true
        env:
          E2E_IMAGE: ${{ steps.build-e2e.outputs.e2e_image }}
        run: |
          if [[ -d "${PLAYWRIGHT_ARTIFACTS_DIR}" ]]; then
            sudo chown -R "$(id -u):$(id -g)" "${PLAYWRIGHT_ARTIFACTS_DIR}"
          fi
          rm -rf -- "${PLAYWRIGHT_ARTIFACTS_DIR}"
          if [[ -n "${E2E_IMAGE}" ]]; then
            docker image rm "${E2E_IMAGE}" || true
          fi

      - name: Cleanup isolated agents test user
        if: always() && env.AGENTS_E2E_USER_STATE_FILE != ''
        run: |
          python3 .github/scripts/bootstrap_agents_e2e_user.py cleanup \
            --state-file "${AGENTS_E2E_USER_STATE_FILE}"

      - name: Notify e2e result
        if: steps.e2e.outcome == 'success'
        continue-on-error: true
        env:
          NOTIFY_API_KEY: ${{ secrets.NOTIFY_API_KEY }}
          E2E_STATUS: ${{ steps.e2e.outcome }}
        run: |
          MESSAGE="Frontend e2e-${{ matrix.lane }} passed"
          python3 .github/scripts/ci_notify.py \
            --category frontend \
            --phase test \
            --status "${E2E_STATUS}" \
            --event "${{ github.event_name }}" \
            --message "${MESSAGE}" \
            --workflow "e2e-${{ matrix.lane }}" \
            --channel frontend \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail workflow on e2e failure
        if: steps.e2e.outcome == 'failure'
        run: exit 1
