name: Desktop Buzz E2E

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "buzz-acp/**"
      - "buzz-backend-provider/**"
      - "desktop/**"
      - "rs-sdk/**"
      - ".github/workflows/desktop-buzz-e2e.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "buzz-acp/**"
      - "buzz-backend-provider/**"
      - "desktop/**"
      - "rs-sdk/**"
      - ".github/workflows/desktop-buzz-e2e.yml"
  workflow_dispatch:

concurrency:
  # The dev identity and #CI channel are shared. Serialize runs and never
  # cancel a process that may still own a paid hosted agent awaiting cleanup.
  group: desktop-buzz-e2e-dev-relay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux app + provider
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Install Tauri Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgtk-3-dev librsvg2-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri
            .

      - name: Install Tauri CLI
        shell: bash
        run: npm install --global @tauri-apps/cli@2.11.4

      - name: Build provider before its integration consumer
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p buzz-backend-hypercli
          mkdir -p desktop/src-tauri/binaries
          cp target/debug/buzz-backend-hypercli \
            desktop/src-tauri/binaries/buzz-backend-hypercli-x86_64-unknown-linux-gnu

      - name: Build real Desktop app
        shell: bash
        working-directory: desktop/src-tauri
        run: tauri build --no-bundle --debug

      - name: Upload integration inputs
        uses: actions/upload-artifact@v4
        with:
          name: desktop-buzz-linux-binaries
          path: |
            desktop/src-tauri/target/debug/HyperCLI
            desktop/src-tauri/target/debug/buzz-backend-hypercli
          if-no-files-found: error
          retention-days: 2

  dev-relay:
    name: Dev relay (launch + #CI reply + cleanup)
    needs: build-linux
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      TEST_EMAIL: ${{ vars.TEST_EMAIL }}
      TEST_API_BASE_URL: "https://api.dev.hypercli.com"
      BUZZ_DEV_E2E_NSEC: ${{ secrets.BUZZ_DEV_E2E_NSEC }}
      BUZZ_DEV_E2E_RELAY_URL: "wss://dev.buzz.hypercli.com"
      HYPERCLI_DESKTOP_APP: ${{ github.workspace }}/desktop/src-tauri/target/debug/HyperCLI
    steps:
      - uses: actions/checkout@v4

      - name: Install WebDriver and secure-storage dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            webkit2gtk-driver xvfb dbus-x11 gnome-keyring libsecret-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      - name: Install tauri-driver
        shell: bash
        run: cargo install tauri-driver --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: desktop-buzz-linux-binaries
          path: desktop/src-tauri/target/debug

      - name: Prepare executable artifacts
        shell: bash
        run: chmod 0755 desktop/src-tauri/target/debug/HyperCLI desktop/src-tauri/target/debug/buzz-backend-hypercli

      - name: Install test dependencies
        shell: bash
        working-directory: desktop/e2e-tests
        run: npm ci --no-fund --no-audit

      - name: Launch through Desktop and require a real #CI reply
        shell: bash
        working-directory: desktop/e2e-tests
        run: |
          set -euo pipefail
          dbus-run-session -- bash -lc '
            eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
            xvfb-run -a npm run test:buzz
          '

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-buzz-e2e-artifacts
          path: desktop/e2e-tests/artifacts/
          if-no-files-found: ignore
