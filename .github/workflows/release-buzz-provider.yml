name: Release Buzz Provider

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Provider version (SemVer, for example 0.1.0)"
        required: true
        type: string
      ref:
        description: "Exact HyperCLI git ref to build"
        required: true
        default: main
        type: string
      publish_release:
        description: "Create the public GitHub Release after all native builds pass"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-buzz-provider-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned provider (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: buzz-backend-hypercli
            archive: buzz-backend-hypercli-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: buzz-backend-hypercli
            archive: buzz-backend-hypercli-linux-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: buzz-backend-hypercli
            archive: buzz-backend-hypercli-macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            executable: buzz-backend-hypercli
            archive: buzz-backend-hypercli-macos-aarch64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: buzz-backend-hypercli.exe
            archive: buzz-backend-hypercli-windows-x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Validate release input and source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Provider version must be stable SemVer" >&2
            exit 1
          fi
          SOURCE_VERSION="$(
            python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])'
          )"
          if [[ "${SOURCE_VERSION}" != "${{ inputs.version }}" ]]; then
            echo "Input version ${{ inputs.version }} does not match provider source version ${SOURCE_VERSION}" >&2
            exit 1
          fi
          test "$(git status --porcelain)" = ""
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Build and test native provider
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-features --locked
          cargo build \
            --locked \
            --release \
            --target "${{ matrix.target }}" \
            -p buzz-backend-hypercli
          "target/${{ matrix.target }}/release/${{ matrix.executable }}" <<<'{"op":"info","request_id":"release-smoke"}' \
            | python3 -c 'import json,sys; value=json.load(sys.stdin); assert value["ok"] is True; assert value["name"] == "HyperCLI"'

      - name: Package unsigned native binary
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ matrix.archive }}-${{ inputs.version }}.tar.gz"
          STAGE="$(mktemp -d)"
          SOURCE="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          if [[ "${{ matrix.target }}" == *-windows-msvc ]]; then
            for runtime in buzz-agent opencode codex claude goose kimi; do
              cp "${SOURCE}" "${STAGE}/buzz-backend-hypercli-${runtime}.exe"
            done
            cp "${SOURCE}" "${STAGE}/buzz-backend-hypercli.exe"
          else
            install -m 0755 "${SOURCE}" "${STAGE}/buzz-backend-hypercli"
          fi
          cp buzz-backend-provider/README.md "${STAGE}/README.md"
          {
            echo "version=${{ inputs.version }}"
            echo "source_sha=${SOURCE_SHA}"
            echo "target=${{ matrix.target }}"
            echo "signing=unsigned"
          } > "${STAGE}/BUILD-INFO"
          tar -C "${STAGE}" -czf "${ARCHIVE}" .
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}-${{ inputs.version }}.tar.gz
            ${{ matrix.archive }}-${{ inputs.version }}.tar.gz.sha256
          if-no-files-found: error

  sign-macos:
    name: Sign macOS binaries
    needs: build
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    env:
      PULUMI_STACK: ${{ secrets.PULUMI_APPLE_CERT_STACK }}
      AWS_PROFILE: ${{ secrets.PULUMI_APPLE_AWS_PROFILE }}
      PULUMI_CONFIG_PASSPHRASE_FILE: ${{ secrets.PULUMI_APPLE_PASSPHRASE_FILE }}
    steps:
      - name: Download unsigned macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: buzz-backend-hypercli-macos-*
          path: unsigned
          merge-multiple: true

      - name: Sign and notarize
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PULUMI_STACK}"
          PULUMI="$HOME/.pulumi/bin/pulumi"
          RCODESIGN="$HOME/.local/bin/rcodesign"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          mkdir "$WORK/stack"
          printf 'name: %s\nruntime: python\n' \
            "$(cut -d/ -f2 <<<"$PULUMI_STACK")" > "$WORK/stack/Pulumi.yaml"
          stack_output() {
            (cd "$WORK/stack" && "$PULUMI" stack output "$1" \
              -s "$PULUMI_STACK" --show-secrets 2>/dev/null)
          }
          stack_output developer-id-application-bundle-pem > "$WORK/signing.pem"
          test -s "$WORK/signing.pem"
          SIGNING="signed-unnotarized"
          if stack_output asc-api-key-p8 > "$WORK/asc.p8" && test -s "$WORK/asc.p8"; then
            "$RCODESIGN" encode-app-store-connect-api-key -o "$WORK/asc.json" \
              "$(stack_output asc-issuer-id)" "$(stack_output asc-key-id)" \
              "$WORK/asc.p8"
            SIGNING="signed-notarized"
          else
            echo "notarization skipped: no ASC API key in stack outputs"
          fi
          rm -rf signed && mkdir signed
          for ARCHIVE in unsigned/*.tar.gz; do
            NAME="$(basename "$ARCHIVE" .tar.gz)"
            STAGE="$WORK/stage-$NAME"
            mkdir "$STAGE"
            tar -C "$STAGE" -xzf "$ARCHIVE"
            "$RCODESIGN" sign \
              --pem-file "$WORK/signing.pem" \
              --for-notarization \
              "$STAGE/buzz-backend-hypercli"
            if [[ "$SIGNING" == "signed-notarized" ]]; then
              (cd "$STAGE" && zip -q "$WORK/$NAME.zip" buzz-backend-hypercli)
              "$RCODESIGN" notary-submit --api-key-file "$WORK/asc.json" \
                --wait "$WORK/$NAME.zip"
            fi
            sed -i "s/^signing=.*/signing=$SIGNING/" "$STAGE/BUILD-INFO"
            tar -C "$STAGE" -czf "signed/$NAME.tar.gz" .
            (cd signed && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          done

      - name: Upload signed macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-macos-bundle
          path: signed/
          if-no-files-found: error

  release:
    name: Assemble provider release
    needs: [build, sign-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: buzz-backend-hypercli-*
          path: dist
          merge-multiple: true

      - name: Overlay signed macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: signed-macos-bundle
          path: dist-signed

      - name: Replace unsigned macOS artifacts with signed
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist-signed -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          cp -f dist-signed/* dist/
          rm -rf dist-signed

      - name: Verify artifact set and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 5
          (
            cd dist
            sha256sum --check ./*.sha256
            sha256sum ./*.tar.gz > SHA256SUMS
          )

      - name: Upload assembled release bundle
        uses: actions/upload-artifact@v4
        with:
          name: buzz-backend-hypercli-${{ inputs.version }}-unsigned
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: buzz-provider-v${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          git merge-base --is-ancestor "${SOURCE_SHA}" origin/main
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists" >&2
            exit 1
          fi
          SIGNING="$(tar -xzOf dist/buzz-backend-hypercli-macos-aarch64-${{ inputs.version }}.tar.gz BUILD-INFO | sed -n 's/^signing=//p')"
          case "${SIGNING}" in
            signed-notarized)
              TITLE_SUFFIX=""
              MAC_NOTE="macOS binaries are signed with Developer ID and notarized." ;;
            signed-unnotarized)
              TITLE_SUFFIX=" (unnotarized)"
              MAC_NOTE="macOS binaries are signed with Developer ID but not yet notarized; Gatekeeper may require explicit approval." ;;
            *)
              TITLE_SUFFIX=" (unsigned)"
              MAC_NOTE="macOS binaries are unsigned; testers must explicitly approve the downloaded binary in Gatekeeper." ;;
          esac
          gh release create "${TAG}" \
            --target "${SOURCE_SHA}" \
            --title "Buzz HyperCLI provider ${{ inputs.version }}${TITLE_SUFFIX}" \
            --notes "${MAC_NOTE} Windows binaries remain unsigned pending Authenticode setup. Backend launch-secret encryption is still an open item for production use." \
            dist/*
