name: Release Buzz Provider

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Provider version (SemVer, for example 0.1.0)"
        required: true
        type: string
      ref:
        description: "Exact HyperCLI git ref to build"
        required: true
        default: main
        type: string
      publish_release:
        description: "Create the public GitHub Release after all native builds pass"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-buzz-provider-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned provider (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: buzz-backend-hypercli
            archive: buzz-backend-hypercli-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: buzz-backend-hypercli
            archive: buzz-backend-hypercli-linux-aarch64
          # macOS binaries are deferred until signing/notarization is ready.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: buzz-backend-hypercli.exe
            archive: buzz-backend-hypercli-windows-x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Validate release input and source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Provider version must be stable SemVer" >&2
            exit 1
          fi
          SOURCE_VERSION="$(
            python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])'
          )"
          if [[ "${SOURCE_VERSION}" != "${{ inputs.version }}" ]]; then
            echo "Input version ${{ inputs.version }} does not match provider source version ${SOURCE_VERSION}" >&2
            exit 1
          fi
          test "$(git status --porcelain)" = ""
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Build and test native provider
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-features --locked
          cargo build \
            --locked \
            --release \
            --target "${{ matrix.target }}" \
            -p buzz-backend-hypercli
          "target/${{ matrix.target }}/release/${{ matrix.executable }}" <<<'{"op":"info","request_id":"release-smoke"}' \
            | python3 -c 'import json,sys; value=json.load(sys.stdin); assert value["ok"] is True; assert value["name"] == "HyperCLI"'

      - name: Package unsigned native binary
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${{ matrix.archive }}-${{ inputs.version }}.tar.gz"
          STAGE="$(mktemp -d)"
          SOURCE="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          if [[ "${{ matrix.target }}" == *-windows-msvc ]]; then
            for runtime in opencode codex claude goose kimi; do
              cp "${SOURCE}" "${STAGE}/buzz-backend-hypercli-${runtime}.exe"
            done
            cp "${SOURCE}" "${STAGE}/buzz-backend-hypercli.exe"
          else
            install -m 0755 "${SOURCE}" "${STAGE}/buzz-backend-hypercli"
          fi
          cp buzz-backend-provider/README.md "${STAGE}/README.md"
          {
            echo "version=${{ inputs.version }}"
            echo "source_sha=${SOURCE_SHA}"
            echo "target=${{ matrix.target }}"
            echo "signing=unsigned"
          } > "${STAGE}/BUILD-INFO"
          tar -C "${STAGE}" -czf "${ARCHIVE}" .
          shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}-${{ inputs.version }}.tar.gz
            ${{ matrix.archive }}-${{ inputs.version }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Assemble unsigned provider release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: buzz-backend-hypercli-*
          path: dist
          merge-multiple: true

      - name: Verify artifact set and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3
          (
            cd dist
            sha256sum --check ./*.sha256
            sha256sum ./*.tar.gz > SHA256SUMS
          )

      - name: Upload assembled release bundle
        uses: actions/upload-artifact@v4
        with:
          name: buzz-backend-hypercli-${{ inputs.version }}-unsigned
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: buzz-provider-v${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          git merge-base --is-ancestor "${SOURCE_SHA}" origin/main
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists" >&2
            exit 1
          fi
          gh release create "${TAG}" \
            --target "${SOURCE_SHA}" \
            --title "Buzz HyperCLI provider ${{ inputs.version }} (unsigned)" \
            --notes "Unsigned test binaries for Buzz Desktop (Linux and Windows; macOS builds are deferred until signing/notarization is configured). Production distribution remains blocked on signing/notarization and backend launch-secret encryption." \
            dist/*
